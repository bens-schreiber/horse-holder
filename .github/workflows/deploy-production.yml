name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "production" to confirm. Anything else aborts.
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "production" ]; then
            echo "::error::confirm must be exactly 'production'; got '$CONFIRM'. Aborting."
            exit 1
          fi

  verify:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: main

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - uses: ./.github/actions/setup

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make deploy-production

      - name: Rollback hint
        if: failure()
        run: |
          echo "::notice::Roll back with: wrangler rollback --env production (run from site/)"
