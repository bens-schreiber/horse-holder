name: Setup toolchain
description: >
  Installs pnpm and Node at the versions pinned in the repo, then installs workspace dependencies.
  Local composite action, so it is covered by branch protection like any other file here and adds
  nothing to the third-party supply chain.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: make install
      shell: bash
      env:
        npm_config_frozen_lockfile: "true"
